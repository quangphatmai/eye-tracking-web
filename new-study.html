<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Study | UVU Eye Tracking</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/new-study.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div class="logo-and-sitename">
        <img src="assets/images/uvu-mono.svg" alt="UVU Logo" class="logo" />
        <h1>EYE TRACKING TESTS AND RESULTS</h1>
      </div>
    </header>

    <main class="form-page">
      <!-- Note: the "Draft" frame in Figma is this same page for editing a draft. Reuse it. -->
      <div class="form-content">
        <a href="index.html" class="btn-outline">&larr; Back</a>

        <h1 id="page-title">New Study</h1>

        <form id="study-form">
          <!-- 1. Project name -->
          <section class="form-section">
            <label for="project-name" class="section-label">Add Project Name:</label>
            <input
              type="text"
              id="project-name"
              name="project-name"
              class="project-name-input"
              placeholder="Project Name"
              autocomplete="off"
              required
            />
          </section>

          <!-- 2. Team members: js/new-study.js adds a name pill for each member before the + Member button.
               The pills sit side by side and wrap to the next line when the row is full -->
          <section class="form-section">
            <h2>Team Members:</h2>
            <ul id="member-list" class="member-list">
              <li class="member-add">
                <button type="button" id="add-member" class="btn-pill">+ Member</button>
              </li>
            </ul>
          </section>

          <!-- 3. Tasks -->
          <section class="form-section">
            <h2>Tasks:</h2>
            <p>Write each task in the box and attach the link associated with the task.</p>

            <div id="task-list">
              <!-- one block per task: js/new-study.js makes Task 1 (or the tasks of the study being edited), Task 2, Task 3... -->
            </div>

            <button type="button" id="add-task" class="btn-outline">+ Add task</button>
          </section>

          <button type="submit" class="btn-primary save-btn">Save</button>
        </form>
      </div>
    </main>

    <script src="js/data/studies.js"></script>
    <script src="js/data/study-store.js"></script>
    <script src="js/new-study.js"></script>
  </body>
</html>
