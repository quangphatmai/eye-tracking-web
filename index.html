<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studies | UVU Eye Tracking</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/add-participant.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
  </head>
  <body>
    <!-- HEADER: logo, "UVU EYE TRACKING TESTS AND RESULTS" -->
    <header>
      <!-- logo + site name: a link to the home page on every page -->
      <a href="index.html" class="logo-and-sitename">
        <img src="assets/images/uvu-mono.svg" alt="UVU Logo" class="logo" />
        <h1>EYE TRACKING TESTS AND RESULTS</h1>
      </a>
    </header>

    <main>
      <!-- FILTER BAR: tabs (reusable .tab-bar, see js/tab-bar.js) + "+ New Study" button.
           data-filter = the card status to show, "all" shows every card -->
      <div class="filter-bar">
        <nav id="study-filter" class="tab-bar" aria-label="Filter studies">
          <button type="button" class="tab-bar-item is-active" data-filter="all" aria-pressed="true">All Studies</button>
          <button type="button" class="tab-bar-item" data-filter="in-progress" aria-pressed="false">In Progress</button>
          <button type="button" class="tab-bar-item" data-filter="completed" aria-pressed="false">Completed</button>
          <button type="button" class="tab-bar-item" data-filter="draft" aria-pressed="false">Drafts</button>
        </nav>
        <a href="new-study.html" class="btn-pill">+ New Study</a>
      </div>

      <!-- STUDY GRID: 3 columns. Card variants: study-card--draft | --in-progress | --completed
         (the variant sets the status dot color, drafts have no Results button; data-status is used by the filter bar)
         Each card: status dot + label, Delete / Edit, project name, Participants #, site name,
         "Add Participant" button, "Results" button (not on drafts) -->
      <div id="study-grid">
        <!-- the cards are made by js/home.js from js/data/studies.js -->
      </div>
      <p class="no-studies" id="no-studies" hidden>No studies in this category yet.</p>
    </main>

    <!-- ADD PARTICIPANT POPUP: opened by the "Add Participant" buttons (js/home.js).
         Same form as add-participant.html. Next goes to consent.html -->
    <dialog id="add-participant-dialog" class="modal" aria-labelledby="add-participant-title">
      <button type="button" class="modal-close" aria-label="Close">&times;</button>
      <section id="add-participant-panel">
        <div class="panel-content">
          <h1 id="add-participant-title">Participants Information</h1>
          <p>
            Please fill out your information below. This information will be used for research purposes only and will remain confidential.
          </p>

          <form id="add-participant-form">
            <div class="field">
              <label for="first-name">First Name:</label>
              <input
                type="text"
                id="first-name"
                name="first-name"
                placeholder="First Name"
                autocomplete="given-name"
                required
              />
            </div>

            <div class="field">
              <label for="last-name">Last Name:</label>
              <input
                type="text"
                id="last-name"
                name="last-name"
                placeholder="Last Name"
                autocomplete="family-name"
                required
              />
            </div>

            <div class="field">
              <label for="age">Age:</label>
              <input
                type="text"
                id="age"
                name="age"
                placeholder="Enter Age"
                inputmode="numeric"
                pattern="[0-9]{1,3}"
                maxlength="3"
                title="Please enter your age as a number"
                autocomplete="off"
                required
              />
            </div>

            <div class="field">
              <label for="gender">Gender:</label>
              <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
                <option value="prefer-not-to-say">Prefer not to say</option>
              </select>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-primary next-btn">Next</button>
            </div>
          </form>
        </div>
      </section>
    </dialog>

    <!-- Delete confirmation: opened by the Delete link on a card (js/home.js fills in the study name) -->
    <dialog id="delete-study-dialog" class="modal" aria-labelledby="delete-study-title">
      <section id="delete-study-panel">
        <button type="button" class="modal-close" aria-label="Close">&times;</button>
        <h2 id="delete-study-title">Delete study?</h2>
        <p id="delete-study-message"></p>
        <div class="delete-actions">
          <button type="button" id="delete-cancel" class="btn-outline">Cancel</button>
          <button type="button" id="delete-confirm" class="btn-primary">Delete</button>
        </div>
      </section>
    </dialog>

    <script src="js/data/studies.js"></script>
    <script src="js/data/study-store.js"></script>
    <script src="js/add-participant.js"></script>
    <script src="js/tab-bar.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>
