<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Participant | UVU Eye Tracking</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/add-participant.css">
</head>
<body>

  <!-- HEADER -->
      <header>
      <div class="logo-and-sitename">
        <img src="assets/images/uvu-mono.svg" alt="UVU Logo" class="logo" />
        <h1>EYE TRACKING TESTS AND RESULTS</h1>
      </div>

    </header>
  <main>
    <!-- White panel: heading "PARTICIPANTS INFORMATION", instruction line
         Fields: First Name, Last Name, Gender (select), Age (select)
         "Next" button -->

    <section id="add-participant-panel">
      <h1>PARTICIPANT INFORMATION</h1>
      <p>Please fill out your information below, first and last name, gender, and your age</p>
      <form id="add-participant-form">
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="first-name" required>

        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="last-name" required>

        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
          <option value="prefer-not-to-say">Prefer not to say</option>
        </select>

        <label for="age">Age</label>
        <select id="age" name="age" required>
          <option value="">Select Age</option>
          <!-- Age options will be populated by JavaScript -->
        </select>

        <button type="submit">Next</button>
  </main>

  <script src="js/add-participant.js"></script>
</body>
</html>
