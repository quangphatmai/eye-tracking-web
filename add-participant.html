<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Participant | UVU Eye Tracking</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/add-participant.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <!-- logo + site name: a link to the home page on every page -->
      <a href="index.html" class="logo-and-sitename">
        <img src="assets/images/uvu-mono.svg" alt="UVU Logo" class="logo" />
        <h1>EYE TRACKING TESTS AND RESULTS</h1>
      </a>
    </header>

    <main class="add-participant-page">
      <!-- White panel: heading "PARTICIPANTS INFORMATION", instruction line
           Fields: First Name, Last Name (text), Gender, Age (select)
           "Next" button -->
      <section id="add-participant-panel">
        <div class="panel-content">
          <h1>Participants Information</h1>
          <p>
            Please fill out your information below. This information will be used for research purposes only and will remain confidential.
          </p>

          <form id="add-participant-form">
            <div class="field">
              <label for="first-name">First Name:</label>
              <input
                type="text"
                id="first-name"
                name="first-name"
                placeholder="First Name"
                autocomplete="given-name"
                required
              />
            </div>

            <div class="field">
              <label for="last-name">Last Name:</label>
              <input
                type="text"
                id="last-name"
                name="last-name"
                placeholder="Last Name"
                autocomplete="family-name"
                required
              />
            </div>

            <div class="field">
              <label for="age">Age:</label>
              <input
                type="text"
                id="age"
                name="age"
                placeholder="Enter Age"
                inputmode="numeric"
                pattern="[0-9]{1,3}"
                maxlength="3"
                title="Please enter your age as a number"
                autocomplete="off"
                required
              />
            </div>

            <div class="field">
              <label for="gender">Gender:</label>
              <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
                <option value="prefer-not-to-say">Prefer not to say</option>
              </select>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-primary next-btn">Next</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script src="js/data/study-store.js"></script>
    <script src="js/add-participant.js"></script>
  </body>
</html>
